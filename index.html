<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro's Fantasy Palace — Big Blue Edition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">ny</span>
    <span class="brand-name">Pro's Fantasy Palace</span>
    <span class="brand-tag">Big Blue Edition</span>
  </div>
  <div class="topbar-actions">
    <span id="quota-badge" class="quota" title="The Odds API requests remaining this month"></span>
    <button id="btn-refresh-odds" class="btn btn-primary">↻ Refresh odds</button>
    <button id="btn-refresh-scores" class="btn">✓ Settle scores</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="card">Weekly Card</button>
  <button class="tab" data-tab="lab">Lightning Lab</button>
  <button class="tab" data-tab="shop">Line Shop</button>
  <button class="tab" data-tab="arb">Arb Finder</button>
  <button class="tab" data-tab="ledger">Ledger</button>
  <button class="tab" data-tab="recap">Recap</button>
  <button class="tab" data-tab="settings">Settings</button>
</nav>

<main>
  <section id="tab-card" class="tab-panel"></section>
  <section id="tab-lab" class="tab-panel" hidden></section>
  <section id="tab-shop" class="tab-panel" hidden></section>
  <section id="tab-arb" class="tab-panel" hidden></section>
  <section id="tab-ledger" class="tab-panel" hidden></section>
  <section id="tab-recap" class="tab-panel" hidden></section>
  <section id="tab-settings" class="tab-panel" hidden></section>
</main>

<footer class="footer">
  <p>Pro's Fantasy Palace is a tracking &amp; analysis tool, not betting advice. Sports betting involves risk and no model
  guarantees profit. Bet only what you can afford to lose. 21+.
  Problem? Call 1-800-GAMBLER.</p>
</footer>

<div id="tooltip" class="chart-tooltip" hidden></div>

<script src="js/math.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/elo.js"></script>
<script src="js/card.js"></script>
<script src="js/parlay.js"></script>
<script src="js/lineshop.js"></script>
<script src="js/arb.js"></script>
<script src="js/watcher.js"></script>
<script src="js/recap.js"></script>
<script src="js/ledger.js"></script>
<script src="js/app.js"></script>
</body>
</html>
